<div class="login-bg d-flex align-items-center">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-sm-10 col-md-8 col-lg-5">
        <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
          <div class="card-header text-center py-4 bg-school text-white">
            <img src="assets/logo-colegio.svg" alt="Logo del colegio" class="logo mb-2" />
            <h4 class="mb-0 fw-semibold">Portal Académico</h4>
            <small>Inicio de sesión</small>
          </div>

          <div class="card-body p-4 p-md-5">
            <form (ngSubmit)="submit()" #f="ngForm" novalidate>
              <div class="mb-3">
                <label class="form-label">Usuario</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-person"></i></span>
                  <input
                    class="form-control"
                    name="username"
                    [(ngModel)]="username"
                    required
                    autocomplete="username"
                    placeholder="Ej. 2025-00123 o correo"
                  />
                </div>
                <div class="form-text">Tu número de carnet o correo institucional.</div>
              </div>

              <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-lock"></i></span>
                  <input
                    class="form-control"
                    name="password"
                    [(ngModel)]="password"
                    type="password"
                    required
                    autocomplete="current-password"
                    placeholder="••••••••"
                  />
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label">Tipo de usuario</label>
                <select class="form-select" [(ngModel)]="roleHint" name="roleHint">
                  <option value="">Seleccionar…</option>
                  <option value="student">Alumno</option>
                  <option value="teacher">Maestro</option>
                  <option value="admin">Administrador</option>
                </select>
              </div>

              <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="remember" [(ngModel)]="remember" name="remember">
                  <label class="form-check-label" for="remember">Recordarme</label>
                </div>
                <a class="link-school" href="#" (click)="$event.preventDefault()">¿Olvidaste tu contraseña?</a>
              </div>

              <button class="btn btn-school w-100 py-2" type="submit" [disabled]="f.invalid">
                <i class="bi bi-box-arrow-in-right me-1"></i> Entrar
              </button>

              <div *ngIf="error" class="alert alert-danger mt-3 mb-0 text-center">
                {{ error }}
              </div>
            </form>
          </div>

          <div class="card-footer text-center small text-muted py-3 bg-light">
            © {{ currentYear }} Colegio Santa María — Sistema Académico
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
