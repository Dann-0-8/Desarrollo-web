<!doctype html>
<html lang="es" data-bs-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Universidad Luminar – Iniciar sesión</title>
</head>
<body class="bg-light">

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-xl-10">
        <div class="row g-0 shadow-lg rounded-4 overflow-hidden bg-white">

          <!-- Lado izquierdo -->
          <aside class="col-12 col-lg-6 p-4 p-md-5 bg-body-secondary">
            <span class="badge text-bg-light d-inline-flex align-items-center gap-2 mb-3">
              <span class="fs-5">🎓</span> Universidad Luminar
            </span>

            <h1 class="display-6 mb-2">Plataforma Académica</h1>
            <p class="text-secondary mb-4">
              Comunícate, publica contenidos, asigna tareas y da retroalimentación en un mismo lugar.
            </p>

            <div class="ratio ratio-16x9 rounded-3 overflow-hidden border">
              <img src="/assets/img/Campus.jpg" alt="Campus Luminar" class="w-100 h-100 object-fit-cover">


            </div>
          </aside>

          <!-- Formulario -->
          <section class="col-12 col-lg-6 p-4 p-md-5">
            <h2 class="h3 mb-2">Iniciar sesión</h2>
            <p class="text-secondary mb-4">Usa tu correo institucional para ingresar.</p>

            <form onsubmit="event.preventDefault(); location.href='panel-principal.html'">
              <div class="vstack gap-3">

                <div>
                  <label for="rol" class="form-label">Rol</label>
                  <select id="rol" class="form-select" required>
                    <option value="alumno">Alumno</option>
                    <option value="docente">Docente</option>
                  </select>
                </div>

                <div>
                  <label for="correo" class="form-label">Correo</label>
                  <input id="correo" type="email" class="form-control" placeholder="usuario@luminar.edu" required>
                </div>

                <div>
                  <label for="pwd" class="form-label">Contraseña</label>
                  <input id="pwd" type="password" class="form-control" placeholder="••••••••" required>
                </div>

                <div class="d-flex justify-content-between align-items-center">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="remember">
                    <label class="form-check-label text-secondary" for="remember">Recuérdame</label>
                  </div>
                  <a href="#" class="link-body-emphasis text-decoration-none">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100">Ingresar</button>

                <small class="text-secondary d-block text-center mt-2">
                  © <span id="yy"></span> Universidad Luminar
                </small>
              </div>
            </form>
          </section>

        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('yy').textContent = new Date().getFullYear();
  </script>
</body>
</html>
